name: Python CI

# Talar om när jobben ska köras: vid push eller pull request mot main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # 1. Hämta koden
      - name: Checka ut koden från repot
        uses: actions/checkout@v4

      # 2. Installera Python
      - name: Inställningar för Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Installera beroenden
      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # 4. Linting
      - name: Linta koden med flake8
        run: flake8 src tests

      # 5. Kör enhets- och integrationstester
      - name: Kör testerna med pytest
        run: pytest --maxfail=1 --disable-warnings -q

      # 6. Kör BDD-testerna (headless webbläsare)
      - name: Kör BDD-testerna med behave
        run: behave
